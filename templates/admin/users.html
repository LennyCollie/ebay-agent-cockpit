{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Benutzerverwaltung</h1>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>E-Mail</th>
            <th>Premium</th>
          </tr>
        </thead>
        <tbody>
          {% if users %}
            {% for u in users %}
            <tr>
              <td>{{ u.id }}</td>
              <td>{{ u.email }}</td>
              <td>
                {% if u.is_premium %}
                  <span class="badge bg-success">Premium</span>
                {% else %}
                  <span class="badge bg-secondary">Free</span>
                {% endif %}
              </td>
            </tr>
            {% endfor %}
          {% else %}
            <tr>
              <td colspan="3" class="text-muted">Keine Benutzer gefunden.</td>
            </tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
