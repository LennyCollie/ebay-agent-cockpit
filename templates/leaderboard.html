{% extends "base.html" %}
{% block title %}Leaderboard - Top Performers{% endblock %}
{% block content %}
<div class="container">
  <h1 class="h3 mb-4">🏆 Leaderboard - Top Performers</h1>

  <ul class="nav nav-tabs mb-4" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="alltime-tab" data-bs-toggle="tab" data-bs-target="#alltime" data-period="all_time">
        ⏱️ All-Time
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="monthly-tab" data-bs-toggle="tab" data-bs-target="#monthly" data-period="monthly">
        📅 Monatlich
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="weekly-tab" data-bs-toggle="tab" data-bs-target="#weekly" data-period="weekly">
        📆 Wöchentlich
      </button>
    </li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="alltime" role="tabpanel">
      <div id="alltime-leaderboard" class="leaderboard-container">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Wird geladen...</span>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="monthly" role="tabpanel">
      <div id="monthly-leaderboard" class="leaderboard-container">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Wird geladen...</span>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="weekly" role="tabpanel">
      <div id="weekly-leaderboard" class="leaderboard-container">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Wird geladen...</span>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .leaderboard-table {
    margin-top: 1rem;
  }
  
  .rank-1 {
    background-color: #fff3cd;
    border-left: 4px solid gold;
  }
  
  .rank-2 {
    background-color: #f5f5f5;
    border-left: 4px solid silver;
  }
  
  .rank-3 {
    background-color: #fff5e1;
    border-left: 4px solid #cd7f32;
  }
  
  .rank-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-weight: bold;
    color: white;
  }
  
  .rank-1 .rank-badge {
    background-color: gold;
    color: #333;
  }
  
  .rank-2 .rank-badge {
    background-color: silver;
    color: #333;
  }
  
  .rank-3 .rank-badge {
    background-color: #cd7f32;
  }
  
  .leaderboard-container {
    min-height: 300px;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const tabButtons = document.querySelectorAll('[role="presentation"] button');
  
  tabButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const period = this.getAttribute('data-period');
      const tabId = this.getAttribute('id').replace('-tab', '');
      loadLeaderboard(period, tabId);
    });
  });
  
  loadLeaderboard('all_time', 'alltime');
});

function loadLeaderboard(period, tabId) {
  const container = document.getElementById(`${tabId}-leaderboard`);
  container.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Wird geladen...</span></div>';
  
  fetch(`/api/leaderboard?period=${period}&limit=100`)
    .then(r => r.json())
    .then(data => {
      renderLeaderboard(data, container, tabId);
    })
    .catch(err => {
      container.innerHTML = '<div class="alert alert-danger">Fehler beim Laden der Leaderboard</div>';
      console.error(err);
    });
}

function renderLeaderboard(data, container, tabId) {
  if (!data.leaderboard || data.leaderboard.length === 0) {
    container.innerHTML = '<div class="alert alert-info">Noch keine Einträge für diese Periode</div>';
    return;
  }
  
  let html = '<div class="leaderboard-table"><table class="table">';
  html += '<thead><tr><th>Rang</th><th>Benutzer</th><th>Points</th><th>Profil</th></tr></thead>';
  html += '<tbody>';
  
  data.leaderboard.forEach((user, index) => {
    const medalClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
    
    html += `
      <tr class="${medalClass}">
        <td><div class="rank-badge">${medal}</div></td>
        <td>
          <strong>${user.email.split('@')[0]}</strong>
          <br>
          <small class="text-muted">${user.email}</small>
        </td>
        <td><strong>${user.points}</strong> Punkte</td>
        <td>
          <a href="/profile/${user.user_id}" class="btn btn-sm btn-outline-primary">Profil anschauen</a>
        </td>
      </tr>
    `;
  });
  
  html += '</tbody></table></div>';
  container.innerHTML = html;
}
</script>
{% endblock %}
